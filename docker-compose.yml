services:
  app:
    build: .
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    environment:
      HOME: /home/appuser
    ports:
      - "0.0.0.0:8090:8080"
    volumes:
      - ./data:/app/data
      - ./seed:/app/seed:ro
      - ${HOME}/.claude:/home/appuser/.claude   # reuse host claude auth
      - ${HOME}/.claude.json:/home/appuser/.claude.json

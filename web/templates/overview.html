{% extends "base.html" %}
{% block title %}Overview{% endblock %}
{% block content %}
<h1>포트폴리오</h1>
<div class="totals" id="totals"></div>
<h2>계좌</h2>
<div class="cards" id="accounts"></div>
{% endblock %}
{% block scripts %}
<script>
const fmt = (n, cur) => new Intl.NumberFormat('ko-KR',
  { style: 'currency', currency: cur, maximumFractionDigits: 0 }).format(n);
const pctStr = n => (n >= 0 ? '+' : '') + (n * 100).toFixed(2) + '%';
const signed = (n, cur) => new Intl.NumberFormat('ko-KR',
  { style: 'currency', currency: cur, maximumFractionDigits: 0, signDisplay: 'always' }).format(n);

async function load() {
  const s = await fetch('/api/summary').then(r => r.json());
  document.getElementById('totals').innerHTML = s.totals.map(t => `
    <div class="card">
      <div class="kv"><span>${t.currency} 합계</span>
        <span class="pill ${t.pct_return>=0?'pos':'neg'}">${pctStr(t.pct_return)}</span>
      </div>
      <div class="kv big"><span>평가</span><strong>${fmt(t.value, t.currency)}</strong></div>
      <div class="kv"><span>평가손익</span>
        <strong class="${t.pnl>=0?'pos':'neg'}">${signed(t.pnl, t.currency)}</strong>
      </div>
    </div>`).join('');

  document.getElementById('accounts').innerHTML = s.accounts.map(a => `
    <div class="card"><a href="/accounts/${a.account_id}">
      <h2>${a.name}<span class="tag">${a.broker}</span></h2>
      <div class="kv big"><span>평가</span><strong>${fmt(a.value, a.currency)}</strong></div>
      <div class="kv"><span>원가</span><strong>${fmt(a.cost, a.currency)}</strong></div>
      <div class="kv"><span>수익률</span>
        <span class="pill ${a.pct_return>=0?'pos':'neg'}">${pctStr(a.pct_return)}</span>
      </div>
      <div class="kv"><span>평가손익</span>
        <strong class="${a.pnl>=0?'pos':'neg'}">${signed(a.pnl, a.currency)}</strong>
      </div>
    </a></div>`).join('');
}
load();
setInterval(load, 15 * 60 * 1000);
</script>
{% endblock %}

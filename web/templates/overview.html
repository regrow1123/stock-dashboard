{% extends "base.html" %}
{% block title %}포트폴리오{% endblock %}
{% block header_title %}포트폴리오{% endblock %}

{% block content %}
<section aria-labelledby="hero-heading" class="mt-1">
  <h2 id="hero-heading" class="sr-only">총합</h2>

  <div id="currency-switch" class="mb-3" hidden>
    <div class="chip-group" role="tablist" aria-label="통화 선택"></div>
  </div>

  <div id="hero" aria-live="polite" aria-busy="true">
    <div class="card card-body">
      <div class="kv"><span class="label">평가 합계</span><span class="skeleton" style="width: 5rem; height: 1rem"></span></div>
      <div class="mt-2 skeleton" style="width: 60%; height: 2.25rem"></div>
      <div class="mt-3 skeleton" style="width: 40%; height: 1rem"></div>
    </div>
  </div>
</section>

<section aria-labelledby="accounts-heading">
  <div class="section-heading">
    <h2 id="accounts-heading">계좌</h2>
    <span id="last-updated" class="text-xs text-[color:var(--color-muted)]"></span>
  </div>

  <ul id="accounts" class="row-list" aria-busy="true">
    <li class="row-item"><div><div class="row-title skeleton" style="width: 60%; height: 1rem"></div><div class="row-sub skeleton mt-2" style="width: 40%; height: 0.75rem"></div></div><div class="row-right skeleton" style="width: 5rem; height: 1rem"></div></li>
    <li class="row-item"><div><div class="row-title skeleton" style="width: 55%; height: 1rem"></div><div class="row-sub skeleton mt-2" style="width: 35%; height: 0.75rem"></div></div><div class="row-right skeleton" style="width: 5rem; height: 1rem"></div></li>
  </ul>
</section>
{% endblock %}

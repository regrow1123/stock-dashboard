{% extends "base.html" %}
{% block title %}{{ account.name }}{% endblock %}
{% block header_title %}{{ account.name }}{% endblock %}

{% block content %}
<div class="mt-1 mb-3 text-[color:var(--color-muted)] text-sm">
  <span class="tag">{{ account.broker }}</span>
  <span class="ml-1">{{ account.currency }}</span>
</div>

<section aria-labelledby="weights-heading">
  <div class="section-heading">
    <h2 id="weights-heading">종목 비중</h2>
  </div>
  <div class="card card-body">
    <div id="weights" class="weight-list" aria-busy="true">
      <div class="skeleton" style="height: 1rem"></div>
      <div class="skeleton" style="height: 1rem"></div>
      <div class="skeleton" style="height: 1rem"></div>
    </div>
  </div>
</section>

<section aria-labelledby="holdings-heading">
  <div class="section-heading">
    <h2 id="holdings-heading">보유 종목</h2>
  </div>
  <ul id="holdings-list" class="row-list" aria-busy="true" aria-label="보유 종목 목록">
    <li class="row-item"><div><div class="row-title skeleton" style="width:55%;height:1rem"></div><div class="row-sub skeleton mt-2" style="width:40%;height:.75rem"></div></div><div class="row-right skeleton" style="width:5rem;height:1rem"></div></li>
    <li class="row-item"><div><div class="row-title skeleton" style="width:55%;height:1rem"></div><div class="row-sub skeleton mt-2" style="width:40%;height:.75rem"></div></div><div class="row-right skeleton" style="width:5rem;height:1rem"></div></li>
  </ul>
</section>

<section aria-labelledby="post-sells-heading">
  <div class="section-heading">
    <h2 id="post-sells-heading">매도 후 추이</h2>
    <span class="text-xs text-[color:var(--color-muted)]">최근 3개월</span>
  </div>
  <div id="post-sells" aria-live="polite"></div>
</section>

<section aria-labelledby="trades-heading">
  <div class="section-heading">
    <h2 id="trades-heading">최근 매매</h2>
  </div>
  <div id="trades-filter" class="trades-filter" hidden></div>
  <ul id="trades-list" class="row-list" aria-busy="true" aria-label="최근 매매 목록"></ul>
</section>
{% endblock %}

{% block scripts %}
<script>
  window.ACCOUNT_ID = {{ account.id | tojson }};
  window.ACCOUNT_CURRENCY = {{ account.currency | tojson }};
</script>
{% endblock %}

<!doctype html>
<html lang="ko" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)">

  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Portfolio">

  <title>{% block title %}Stock Dashboard{% endblock %}</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-serif@5/500.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/400.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/600.css">
  <link rel="stylesheet" href="/static/styles.css?v={{ asset_ver }}">

  <!-- app.js must register alpine:init listener BEFORE alpine loads -->
  <script defer src="/static/app.js?v={{ asset_ver }}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body data-page="{{ page|default('') }}"
      x-data="appShell"
      class="min-h-full pb-[env(safe-area-inset-bottom)]">

  <a href="#main" class="skip-link">본문 바로가기</a>

  <header class="app-header" :class="scrolled && 'is-scrolled'">
    <div class="app-header-inner">
      {% if back_href %}
      <a href="{{ back_href }}" class="icon-btn icon-btn-back" aria-label="{{ back_label|default('뒤로') }}">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      {% endif %}

      <h1 class="page-title">{% block header_title %}{% endblock %}</h1>
    </div>
    {% block header_sub %}{% endblock %}
  </header>

  <main id="main" tabindex="-1" class="max-w-[960px] mx-auto px-4 pt-3 pb-8">
    {% block content %}{% endblock %}
  </main>

  <div class="toast-host" aria-live="polite" aria-atomic="false">
    <template x-for="t in $store.toast.items" :key="t.id">
      <div class="toast" :class="t.kind === 'error' && 'error'" x-text="t.msg"></div>
    </template>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
